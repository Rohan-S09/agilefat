name: CI/CD Pipeline for Shopping Bill App

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: pytest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/shopping-bill-app:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/shopping-bill-app:latest

      - name: Start Local Kubernetes Cluster (Minikube)
        uses: medyagh/setup-minikube@master
        with:
          minikube-version: 'latest'
          driver: docker
          kubernetes-version: 'v1.28.0'

      - name: Deploy to Kubernetes
        run: |
          # 1. Export the image tag variant for substitution
          export IMAGE_TAG=${{ github.sha }}
          
          # 2. Perform configuration substitution and apply deployment to the running cluster
          envsubst < k8s-deployment.yaml | kubectl apply -f -
          
          # 3. Verify the deployment status to ensure it ran successfully
          echo "=== Verifying Kubernetes Objects ==="
          kubectl get deployments
          kubectl get pods
          kubectl get services

      - name: Deploy to Kubernetes
        run: |
          echo "${{ secrets.KUBECONFIG_DATA }}" > kubeconfig.yaml
          export IMAGE_TAG=${{ steps.meta.outputs.TAG }}
          envsubst < k8s-deployment.yaml | kubectl apply --kubeconfig=kubeconfig.yaml -f -


on:
  push:
    branches: [ "main" ]

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: pytest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract unique tag (short commit SHA)
        id: meta
        run: echo "TAG=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/shopping-bill-app:${{ steps.meta.outputs.TAG }}
            ${{ secrets.DOCKER_USERNAME }}/shopping-bill-app:latest

      - name: Set up Kubernetes (kubectl)
        uses: azure/setup-kubectl@v3

      - name: Configure Kubernetes context
        run: |
          echo "${{ secrets.KUBECONFIG_DATA }}" > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml

      - name: Deploy to Kubernetes
        run: |
          export IMAGE_TAG=${{ steps.meta.outputs.TAG }}
          envsubst < k8s-deployment.yaml | kubectl apply -f -

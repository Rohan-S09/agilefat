apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-bill-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopping-bill
  template:
    metadata:
      labels:
        app: shopping-bill
    spec:
      containers:
      - name: shopping-bill-container
        image: YOUR_DOCKERHUB_USERNAME/shopping-bill-app:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: shopping-bill-service
spec:
  type: NodePort
  selector:
    app: shopping-bill
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080
